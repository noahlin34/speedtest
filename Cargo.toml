[package]
name = "speedtest"
version = "0.1.0"
edition = "2021"
description = "A Ratatui terminal frontend for Fast.com speed measurements"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
futures-util = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
